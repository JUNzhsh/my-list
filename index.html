<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JUN's List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --fg: #171717;
    --muted: rgb(23 23 23 / .75); --faint: rgb(23 23 23 / .15);
    --line: #e5e5e5; --chip: #f2f2f2; --error: #c2410c;
    --speed: .2s; --curve: cubic-bezier(.2, .8, .2, 1);
    --gut: 28px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0a0a0a; --fg: #ededed;
            --muted: rgb(237 237 237 / .7); --faint: rgb(237 237 237 / .18);
            --line: #262626; --chip: #1f1f1f; --error: #fb923c; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0a0a0a; --fg: #ededed;
          --muted: rgb(237 237 237 / .7); --faint: rgb(237 237 237 / .18);
          --line: #262626; --chip: #1f1f1f; --error: #fb923c; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: Geist, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
         -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1240px; margin: 0 auto; }
  header, section, footer, .empty {
    padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
    padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
  }
  header { padding-block: 72px 52px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .filter { width: 160px; min-width: 0; font: inherit; font-size: 13px;
            color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--line);
            padding: 6px 0; outline: none; transition: border-color var(--speed) var(--curve); }
  .filter::placeholder { color: var(--muted); opacity: .6; }
  .filter:focus { border-color: var(--fg); }
  .filter::-webkit-search-cancel-button { display: none; }

  /* Sections flow top to bottom through four columns, divided by hairlines */
  main { columns: 4; column-gap: 0; column-rule: 1px solid var(--line); border-top: 1px solid var(--line); }
  section { break-inside: avoid; padding-block: 32px; border-bottom: 1px solid var(--line); min-width: 0; }
  h2 { font-size: 16px; font-weight: 500; margin: 0 0 13px; display: flex; align-items: center; gap: 6px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }

  a { display: inline-flex; align-items: center; gap: 8px; padding: 3.6px 0; max-width: 100%;
      font-size: 14px; color: var(--muted); text-decoration: underline;
      text-decoration-color: var(--faint); text-underline-offset: 3px; }
  a span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav { position: relative; width: 16px; height: 16px; flex: none; border-radius: 4px;
         background: var(--chip); display: grid; place-items: center;
         font-size: 10px; font-weight: 600; color: var(--muted); text-decoration: none;
         transition: background-color var(--speed) var(--curve); }
  .fav.has { background: transparent; }
  .fav img { width: 16px; height: 16px; border-radius: 3px; position: absolute; inset: 0;
             transition: opacity var(--speed) var(--curve); }
  .fav svg { position: absolute; inset: 0; margin: auto; opacity: 0; color: var(--fg);
             transition: opacity var(--speed) var(--curve); }
  .fav .l { transition: opacity var(--speed) var(--curve); }
  @media (hover: hover) and (pointer: fine) {
    a:hover { color: var(--fg); text-decoration-color: currentColor; }
    a:hover .fav { background: transparent; }
    a:hover .fav img, a:hover .fav .l { opacity: 0; }
    a:hover .fav svg { opacity: 1; }
  }

  /* Locked sections */
  h2 .lock { color: var(--muted); }
  .unlock { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .unlock input { width: 120px; font: inherit; font-size: 14px; color: var(--fg); background: transparent;
                  border: 0; border-bottom: 1px solid var(--line); padding: 6px 0; outline: none;
                  letter-spacing: .2em; transition: border-color var(--speed) var(--curve); }
  .unlock input::placeholder { letter-spacing: normal; color: var(--muted); opacity: .6; }
  .unlock input:focus { border-color: var(--fg); }
  .unlock button { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0;
                   padding: 4px 0; cursor: pointer; text-decoration: underline;
                   text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .unlock button:hover { color: var(--fg); text-decoration-color: currentColor; }
  .unlock .msg { font-size: 12px; color: var(--error); }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

  footer { padding-block: 32px 56px; font-size: 12px; color: var(--muted); }
  footer a { font-size: 12px; padding: 0; }
  .empty { display: none; padding-block: 44px; font-size: 14px; color: var(--muted); }

  @media (max-width: 1040px) { main { columns: 3; } }
  @media (max-width: 780px) { main { columns: 2; } }
  @media (max-width: 520px) {
    :root { --gut: 16px; }
    header { padding-block: 48px 36px; }
    .filter { width: 110px; }
    main { columns: 1; }
    section { padding-block: 28px; }
    footer { padding-block: 24px 40px; }
  }
</style>

const ARROW = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3.5 8.5l5-5M4.5 3.5h4v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LOCK = '<svg class="lock" width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2.5" y="5.5" width="7" height="5" rx="1" stroke="currentColor" stroke-width="1.1"/><path d="M4 5.5V4a2 2 0 014 0v1.5" stroke="currentColor" stroke-width="1.1"/></svg>';
const main = document.getElementById("main");
let sections = [];

function renderGroup(sec, group) {
  sec.innerHTML = `<h2></h2><ul></ul>`;
  sec.querySelector("h2").textContent = group.cat;
  const ul = sec.querySelector("ul");
  group.items.forEach(([name, url, icon]) => {
    const host = new URL(url).hostname.replace(/^www\./, "");
    const li = document.createElement("li");
    li.dataset.key = (name + " " + host + " " + group.cat).toLowerCase();
    li.innerHTML = `<a target="_blank" rel="noopener"><span class="fav"><span class="l"></span>${ARROW}</span><span class="t"></span></a>`;
    li.querySelector("a").href = url;
    li.querySelector(".t").textContent = name;
    li.querySelector(".l").textContent = [...name][0].toUpperCase();
    if (icon) {
      const img = new Image();
      img.alt = "";
      img.onload = () => { const fav = li.querySelector(".fav");
        fav.classList.add("has"); fav.querySelector(".l").remove(); fav.prepend(img); };
      img.src = icon.startsWith("data:") ? icon : "icons/" + icon;
    }
    ul.appendChild(li);
  });
}

function renderLocked(sec, cat) {
  sec.dataset.locked = "1";
  sec.innerHTML = `<h2>${LOCK}<span></span></h2>
    <form class="unlock"><input type="password" inputmode="numeric" placeholder="输入密码" aria-label="密码">
    <button type="submit">解锁</button><span class="msg" aria-live="polite"></span></form>`;
  sec.querySelector("h2 span").textContent = cat;
  sec.querySelector("form").addEventListener("submit", async e => {
    e.preventDefault();
    const input = sec.querySelector("input"), msg = sec.querySelector(".msg");
    msg.textContent = "";
    const ok = await unlock(input.value);
    if (!ok) { msg.textContent = "密码不对"; input.select();
      sec.classList.remove("shake"); void sec.offsetWidth; sec.classList.add("shake"); }
  });
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(VAULT.salt), iterations: VAULT.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(VAULT.iv) }, key, b64(VAULT.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function unlock(password) {
  let groups;
  try { groups = await decrypt(password); } catch { return false; }
  sections.filter(s => s.dataset.locked).forEach(sec => {
    const group = groups.find(g => g.cat === sec.dataset.cat);
    delete sec.dataset.locked;
    if (group) renderGroup(sec, group);
  });
  try { sessionStorage.setItem("jl-pw", password); } catch {}
  applyFilter();
  return true;
}

SECTIONS.forEach(item => {
  const sec = document.createElement("section");
  if (item.locked) { sec.dataset.cat = item.cat; renderLocked(sec, item.cat); }
  else renderGroup(sec, item);
  main.appendChild(sec);
  sections.push(sec);
});

const q = document.getElementById("q");
function applyFilter() {
  const v = q.value.trim().toLowerCase();
  let any = false;
  sections.forEach(sec => {
    if (sec.dataset.locked) { sec.style.display = v ? "none" : ""; if (!v) any = true; return; }
    let shown = 0;
    sec.querySelectorAll("li").forEach(li => {
      const ok = !v || li.dataset.key.includes(v);
      li.style.display = ok ? "" : "none"; if (ok) shown++;
    });
    sec.style.display = shown ? "" : "none"; if (shown) any = true;
  });
  document.getElementById("empty").style.display = any ? "none" : "block";
}
applyFilter();
q.addEventListener("input", applyFilter);
q.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const visible = [...document.querySelectorAll("li")].filter(li => li.style.display !== "none" && li.closest("section").style.display !== "none");
  if (q.value.trim() && visible.length === 1) visible[0].querySelector("a").click();
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); q.focus(); }
});

// Stay unlocked for the rest of this browser session
try { const pw = sessionStorage.getItem("jl-pw"); if (pw) unlock(pw); } catch {}
</script>
